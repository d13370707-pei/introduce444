<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <!-- Glowing ember radial gradient -->
    <radialGradient id="emberGlow" cx="60%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#ff7b25" />
      <stop offset="60%" stop-color="#c93b3b" />
      <stop offset="100%" stop-color="rgba(201, 59, 59, 0)" />
    </radialGradient>
    <!-- Filter cylinder gradient (aged/faded yellow-tan filter) -->
    <linearGradient id="filterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#807261" />
      <stop offset="50%" stop-color="#54493c" />
      <stop offset="100%" stop-color="#362f27" />
    </linearGradient>
    <!-- White paper burned gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c4c9d4" />
      <stop offset="55%" stop-color="#7a8291" />
      <stop offset="85%" stop-color="#363a42" />
      <stop offset="100%" stop-color="#181a1f" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Surface shadow & ash stain on ground -->
  <ellipse cx="120" cy="148" rx="75" ry="14" fill="#000000" opacity="0.65"/>
  <ellipse cx="160" cy="147" rx="30" ry="8" fill="#1c1f26" opacity="0.8"/>
  <!-- Ash flakes scattered on floor -->
  <circle cx="152" cy="146" r="2" fill="#525966"/>
  <circle cx="165" cy="151" r="3" fill="#353b47"/>
  <circle cx="178" cy="145" r="1.5" fill="#6d7687"/>
  <circle cx="172" cy="149" r="2.2" fill="#242730"/>
  <circle cx="140" cy="150" r="1.8" fill="#4a505e"/>

  <!-- CIGARETTE BODY (Leaning slightly, bent/stubbed at the end) -->
  <g transform="rotate(-6 120 140)">
    <!-- Amber Filter Cork Tip (left side) -->
    <path d="M60,132 L95,132 L95,147 L60,147 C58,147 57,143 57,139.5 C57,136 58,132 60,132 Z" fill="url(#filterGrad)" stroke="#231f1a" stroke-width="1.2"/>
    <!-- Filter stripes / tipping paper line -->
    <line x1="93" y1="132" x2="93" y2="147" stroke="#3d352b" stroke-width="1.5"/>

    <!-- Cigarette White Paper (crushed/wrinkled slightly) -->
    <path d="M95,132 L150,132 C154,134 156,136 158,139 C157,142 153,145 150,147 L95,147 Z" fill="url(#paperGrad)" stroke="#242730" stroke-width="1.2"/>
    <!-- Paper crease marks -->
    <path d="M125,132 L128,147 M138,133 L136,146" stroke="#484f5e" stroke-width="0.8"/>

    <!-- Burned Rim / Carbon Ring (charred black edge) -->
    <path d="M148,131 C153,131 158,135 157,139.5 C156,144 152,148 147,148 L152,148 C157,148 161,144 161,139.5 C161,135 156,131 152,131 Z" fill="#0f1114"/>

    <!-- Ash Tip (crumpled grey ash cylinder at the head) -->
    <path d="M152,132 C156,133 166,134 168,137 C170,140 166,144 162,146 C158,148 152,147 150,147 Z" fill="#3d434f" stroke="#1f232b" stroke-width="1"/>
    <path d="M162,134 C167,135 172,137 170,141 C168,144 163,145 160,144 Z" fill="#586173"/>

    <!-- GLOWING EMBER (Smoldering hot coal inside the ash) -->
    <circle cx="159" cy="139" r="6" fill="url(#emberGlow)" filter="url(#glow)"/>
    <circle cx="159" cy="139" r="2.5" fill="#fff" opacity="0.95"/>
    <circle cx="164" cy="141" r="1.8" fill="#ff7b25" filter="url(#glow)"/>
  </g>

  <!-- RISING WISPY SMOKE (Stylized curved smoke trails) -->
  <g fill="none" stroke-linecap="round" opacity="0.55">
    <!-- Smoke Strand 1 -->
    <path d="M156,128 C154,115 165,100 158,85 C150,70 138,55 145,35 C150,20 165,10 160,2" stroke="#8c96a8" stroke-width="2.5"/>
    <!-- Smoke Strand 2 -->
    <path d="M160,126 C168,110 172,95 165,80 C156,62 168,45 162,25 C158,12 148,5 152,0" stroke="#606a7a" stroke-width="1.8"/>
    <!-- Smoke Strand 3 (Thin diffuse branch) -->
    <path d="M154,105 C142,95 135,80 142,65 C148,52 140,38 136,25" stroke="#788496" stroke-width="1.2" stroke-dasharray="3,2"/>
  </g>
</svg>

